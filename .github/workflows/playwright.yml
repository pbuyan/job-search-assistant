name: Playwright Tests

# Browser tests against a dev server. They need a real Clerk dev instance, a
# test user and a database, so they only run when these repository secrets
# are set (Settings → Secrets and variables → Actions):
#   CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY  Clerk dev instance keys
#   E2E_CLERK_USER_EMAIL                     dedicated test user (its data is overwritten)
#   E2E_DATABASE_URL                         a database for tests, e.g. a Neon branch
#                                            (pgvector enabled; migrated before the tests)
# Without them (including on pull requests from forks) the job passes with a
# notice. The billed AI flows (E2E_AI) never run in CI.
on:
  push:
    branches: [master, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check for E2E secrets
        id: secrets
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$CLERK_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::E2E secrets aren't configured, so Playwright was skipped. See .github/workflows/playwright.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Brings the test database up to the schema of this commit.
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm db:migrate
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec playwright test
      - if: ${{ !cancelled() && steps.secrets.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
